[package]
name = "nats-atomic-publisher"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Concurrent atomic JetStream publication with bounded queues and conflict isolation"
publish = false

[dependencies]
async-nats = "0.50"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v7"] }
