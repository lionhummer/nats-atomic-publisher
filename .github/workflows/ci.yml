name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.88.0', stable]
        nats: ['2.12.1', '2.15.0']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: docker run -d --name atomic-nats -p 127.0.0.1:4222:4222 nats:${{ matrix.nats }} -js
      - name: Wait for broker
        run: |
          python3 - <<'PY'
          import socket, time
          for attempt in range(100):
              try:
                  with socket.create_connection(('127.0.0.1', 4222), timeout=1):
                      break
              except OSError:
                  time.sleep(.1)
          else:
              raise RuntimeError('broker did not start')
          PY
      - run: cargo test --locked --test nats -- --ignored
        env:
          NATS_URL: nats://127.0.0.1:4222
      - name: Run examples
        run: |
          cargo run --locked --example basic
          cargo run --locked --example conflict_isolation
          cargo run --locked --example admission_policy
        env:
          NATS_URL: nats://127.0.0.1:4222
      - run: cargo package --locked
